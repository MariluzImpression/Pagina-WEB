<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMPRESSION TV</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap" rel="stylesheet">
    
    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
        }

        #media-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .media-item {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1.2s ease-in-out;
            z-index: 1;
            background: #000;
        }

        .media-item.previous {
            opacity: 1;
            z-index: 1;
        }

        .media-item.active {
            opacity: 1;
            z-index: 2;
        }

        /* Efecto Ken Burns (Acercamiento lento y elegante para fotos) */
        img.media-item.active {
            animation: kenburns 20s linear forwards;
        }

        @keyframes kenburns {
            0% { transform: scale(1.0); }
            100% { transform: scale(1.15); }
        }

        /* Capa base para cuando no hay contenido o carga */
        #idle-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 0;
            background: radial-gradient(circle at center, #1a000d 0%, #000000 100%);
        }

        .idle-logo {
            width: 60%;
            max-width: 1400px;
            animation: pulse-glow 3s ease-in-out infinite alternate;
        }

        @keyframes pulse-glow {
            0% { filter: drop-shadow(0 0 10px rgba(255,0,127,0.2)); transform: scale(0.98); }
            100% { filter: drop-shadow(0 0 30px rgba(255,0,127,0.8)); transform: scale(1.02); }
        }

        .loader-container {
            position: relative;
            width: 600px;
            height: 12px;
            background: #333;
            border-radius: 12px;
            margin-top: 80px;
            overflow: hidden;
        }

        .loader-bar {
            position: absolute;
            top: 0; left: 0; height: 100%;
            width: 50%;
            background: linear-gradient(90deg, transparent, #FF007F, transparent);
            animation: scan 1.5s ease-in-out infinite;
        }

        @keyframes scan {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(200%); }
        }

        /* Barra de progreso inferior opcional */
        #progress-bar {
            display: none !important;
        }
    </style>

    <!-- INICIO TEMA NAVIDEÑO TV CSS -->
    <!-- ========================================================================= -->
    <!-- TEMA NAVIDEÑO OFICIAL IMPRESSION TV (CSS TEMPORAL)                        -->
    <!-- (Para desactivar tras la temporada: eliminar desde INICIO hasta FIN)      -->
    <!-- ========================================================================= -->
    <style id="tema-navidad-tv-css">
        /* Resplandor festivo sutil en los bordes del televisor */
        #tv-viewport {
            box-shadow: inset 0 0 110px rgba(255, 215, 0, 0.12), inset 0 0 40px rgba(255, 42, 75, 0.15);
        }

        /* Pantalla de espera (Idle) con tono navideño elegante */
        #idle-screen {
            background: radial-gradient(circle at center, #26050d 0%, #05140c 55%, #000000 100%) !important;
        }
        .loader-bar {
            background: linear-gradient(90deg, transparent, #00e676, #ffd700, #ff2a4b, transparent) !important;
        }

        /* Guirnalda realista de pino navideño con luces arriba del TV (escala 2160x4096) */
        .tv-christmas-lights {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 156px;
            z-index: 25;
            pointer-events: none;
            background-image: url('guirnalda_navidad.png');
            background-repeat: repeat-x;
            background-position: top center;
            background-size: auto 150px;
            filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.85));
            overflow: hidden;
        }

        .tv-light-bulb {
            position: absolute;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            animation: tvLightTwinkle 1.9s infinite alternate ease-in-out;
        }

        .tv-bulb-warm  { background: radial-gradient(circle, #ffffff 20%, #fde68a 60%, transparent 100%); box-shadow: 0 0 22px 6px #fde68a, 0 0 46px 12px rgba(253, 230, 138, 0.6); }
        .tv-bulb-gold  { background: radial-gradient(circle, #fffbeb 15%, #ffd700 55%, transparent 100%); box-shadow: 0 0 20px 5px #ffd700, 0 0 44px 10px rgba(255, 215, 0, 0.55); }
        .tv-bulb-red   { background: radial-gradient(circle, #ffe4e6 15%, #ff2a4b 55%, transparent 100%); box-shadow: 0 0 20px 5px #ff2a4b, 0 0 44px 10px rgba(255, 42, 75, 0.55); }
        .tv-bulb-green { background: radial-gradient(circle, #ecfdf5 15%, #00e676 55%, transparent 100%); box-shadow: 0 0 20px 5px #00e676, 0 0 44px 10px rgba(0, 230, 118, 0.5); }
        .tv-bulb-blue  { background: radial-gradient(circle, #ecfeff 15%, #00e5ff 55%, transparent 100%); box-shadow: 0 0 20px 5px #00e5ff, 0 0 44px 10px rgba(0, 229, 255, 0.5); }

        @keyframes tvLightTwinkle {
            0%   { opacity: 0.28; transform: scale(0.8); }
            50%  { opacity: 1;    transform: scale(1.3); }
            100% { opacity: 0.48; transform: scale(0.95); }
        }

        /* Canvas de nieve liviano sobre la transmisión */
        #tv-snow-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 2160px;
            height: 4096px;
            pointer-events: none;
            z-index: 18;
        }

        /* Gorrito navideño en el logo de espera (Idle) */
        .tv-santa-hat {
            position: absolute;
            top: 16px;
            left: 9.8%;
            width: 96px;
            height: 84px;
            z-index: 20;
            pointer-events: none;
            filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.65));
            animation: tvHatWiggle 6s ease-in-out infinite;
            transform-origin: bottom center;
        }
        @keyframes tvHatWiggle {
            0%, 88%, 100% { transform: rotate(-8deg); }
            92% { transform: rotate(-15deg) scale(1.06); }
            95% { transform: rotate(-2deg); }
        }

        /* Cintillo / Banner inferior navideño (estilo broadcast TV) */
        #tv-navidad-banner {
            position: absolute;
            bottom: 48px;
            left: 64px;
            right: 64px;
            z-index: 25;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 44px;
            padding: 30px 48px;
            border-radius: 56px;
            background: linear-gradient(135deg, rgba(110, 12, 30, 0.78) 0%, rgba(8, 12, 10, 0.84) 50%, rgba(12, 65, 35, 0.78) 100%);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border: 2px solid rgba(255, 215, 0, 0.45);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.85), 0 0 45px rgba(255, 42, 75, 0.22);
            overflow: hidden;
        }

        #tv-navidad-banner::before {
            content: '';
            position: absolute;
            top: -80px;
            left: -80px;
            width: 240px;
            height: 240px;
            background: radial-gradient(circle, rgba(255, 42, 75, 0.35) 0%, transparent 70%);
        }
        #tv-navidad-banner::after {
            content: '';
            position: absolute;
            bottom: -80px;
            right: -80px;
            width: 240px;
            height: 240px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.3) 0%, transparent 70%);
        }

        .tv-santa-anim-wrapper {
            width: 245px;
            height: 230px;
            flex-shrink: 0;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: tvSantaFloat 4s ease-in-out infinite;
            filter: drop-shadow(0 12px 26px rgba(0, 0, 0, 0.6));
        }

        @keyframes tvSantaFloat {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-9px); }
        }

        .tv-santa-arm-wave {
            transform-box: fill-box;
            transform-origin: 12% 82%;
            animation: tvSantaWave 2.6s ease-in-out infinite;
        }

        @keyframes tvSantaWave {
            0%, 100% { transform: rotate(0deg); }
            25%      { transform: rotate(-11deg); }
            50%      { transform: rotate(7deg); }
            75%      { transform: rotate(-8deg); }
        }

        .tv-santa-eyes {
            transform-box: fill-box;
            transform-origin: center center;
            animation: tvSantaBlink 4.8s ease-in-out infinite;
        }

        @keyframes tvSantaBlink {
            0%, 92%, 100% { transform: scaleY(1); }
            96% { transform: scaleY(0.1); }
        }

        .tv-santa-hat-group {
            transform-box: fill-box;
            transform-origin: 65% 88%;
            animation: tvSantaHatTilt 4s ease-in-out infinite;
        }

        @keyframes tvSantaHatTilt {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-2deg); }
        }

        .tv-sparkle-svg {
            transform-box: fill-box;
            transform-origin: center center;
            animation: tvSparkleTwinkle 2.2s ease-in-out infinite alternate;
        }

        @keyframes tvSparkleTwinkle {
            0%   { opacity: 0.35; transform: scale(0.75) rotate(0deg); }
            100% { opacity: 1;    transform: scale(1.15) rotate(25deg); }
        }

        .tv-saludo-title {
            font-size: 46px;
            font-weight: 800;
            color: #ffd700;
            margin: 0 0 10px 0;
            letter-spacing: 1px;
            text-shadow: 0 2px 14px rgba(255, 215, 0, 0.35);
        }

        .tv-saludo-text {
            font-size: 35px;
            line-height: 1.38;
            color: #f8fafc;
            margin: 0;
            font-weight: 600;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .tv-saludo-footer {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-top: 16px;
        }

        .tv-saludo-brand {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #ffd700;
            opacity: 0.9;
        }

        .tv-now-playing {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            padding: 8px 24px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 215, 0, 0.3);
            font-size: 22px;
            font-family: system-ui, -apple-system, sans-serif;
            font-weight: 600;
            color: #e2e8f0;
        }

        .tv-music-note-pulse {
            display: inline-block;
            animation: tvMusicBounce 1.2s ease-in-out infinite;
        }
        @keyframes tvMusicBounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.22); }
        }

        /* Controles discretos de audio navideño arriba a la derecha (debajo de la guirnalda) */
        #tv-bgm-controls {
            position: absolute;
            top: 168px;
            right: 54px;
            z-index: 999;
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .tv-bgm-btn {
            background: rgba(10, 12, 14, 0.65);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 2px solid rgba(255, 215, 0, 0.4);
            color: #ffffff;
            border-radius: 999px;
            padding: 16px 28px;
            font-size: 28px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 14px;
            opacity: 0.55;
            transition: opacity 0.3s ease, transform 0.2s ease, border-color 0.3s ease;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
        }
        .tv-bgm-btn:hover {
            opacity: 1;
            border-color: #ffd700;
            transform: scale(1.04);
        }

        .tv-bgm-prompt {
            background: rgba(140, 18, 38, 0.88);
            border: 2px solid #ffd700;
            color: #ffffff;
            border-radius: 999px;
            padding: 18px 34px;
            font-size: 28px;
            font-weight: 700;
            cursor: pointer;
            display: none;
            align-items: center;
            gap: 14px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 215, 0, 0.35);
            animation: tvPromptPulse 2s infinite;
        }
        @keyframes tvPromptPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }
    </style>
    <!-- FIN TEMA NAVIDEÑO TV CSS -->
</head>
<body>
    <div id="tv-viewport" style="position: absolute; top: 50%; left: 50%; width: 2160px; height: 4096px; margin-left: -1080px; margin-top: -2048px; overflow: hidden; transform-origin: center center;">
    <div id="idle-screen">
        <canvas id="particles-canvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; opacity: 0.6; pointer-events: none;"></canvas>
        <div style="position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; width: 100%;">
            <img src="logo.png" alt="IMPRESSION" class="idle-logo">
            <div class="loader-container" id="main-loader"><div class="loader-bar"></div></div>
            <p id="idle-text" style="margin-top: 40px; color: #888; text-align: center; max-width: 80%; font-size: 2.5rem; letter-spacing: 6px; text-transform: uppercase;">Conectando con la nube...</p>
        </div>
    </div>

    <div id="media-container"></div>
    <div id="progress-bar"></div>

    <!-- Botón oculto para activar sonido si se requiere -->
    <button id="unmute-btn" style="position: absolute; top: 20px; right: 20px; z-index: 999; background: rgba(0,0,0,0.5); border: 1px solid #333; color: white; padding: 10px; border-radius: 50%; cursor: pointer; display: none;">
        🔊
    </button>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCpgNwZmq3rgC6ED9DZwWSRv9_DUxV3K-Y",
            authDomain: "impression-web-82c33.firebaseapp.com",
            projectId: "impression-web-82c33",
            storageBucket: "impression-web-82c33.firebasestorage.app",
            messagingSenderId: "622168477796",
            appId: "1:622168477796:web:2945f0a90ce92bdd4ecf71"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let playlist = [];
        let currentIndex = -1;
        let playTimeout = null;
        let isPlaying = false;
        let audioEnabled = false;

        const container = document.getElementById('media-container');
        const idleScreen = document.getElementById('idle-screen');
        const idleText = document.getElementById('idle-text');
        const mainLoader = document.getElementById('main-loader');
        const progressBar = document.getElementById('progress-bar');
        const unmuteBtn = document.getElementById('unmute-btn');

        // Permitir sonido si el usuario toca la pantalla una vez (deshabilitado si está activo el fondo musical navideño)
        document.body.addEventListener('click', () => {
            if (document.getElementById('bloque-navidad-tv')) return;
            audioEnabled = true;
            unmuteBtn.style.display = 'none';
            const currentVideo = document.querySelector('video.active');
            if(currentVideo) {
                currentVideo.muted = false;
            }
        }, { once: true });

        // Forzar pantalla completa al primer toque o botón
        function enterFullScreen() {
            let elem = document.documentElement;
            if (!document.fullscreenElement) {
                if (elem.requestFullscreen) {
                    elem.requestFullscreen().catch(e => console.log(e));
                } else if (elem.webkitRequestFullscreen) { /* Safari / TV antiguos */
                    elem.webkitRequestFullscreen();
                } else if (elem.msRequestFullscreen) { /* IE11 */
                    elem.msRequestFullscreen();
                }
            }
        }
        document.addEventListener('click', enterFullScreen);
        document.addEventListener('keydown', enterFullScreen);

        // Escuchar cambios en tiempo real
        db.collection("tv_cartelera").orderBy("timestamp", "asc").onSnapshot((snapshot) => {
            if (snapshot.empty) {
                playlist = [];
                stopPlayback();
                idleText.innerText = "No hay contenido programado.";
                mainLoader.style.display = 'none';
                return;
            }

            const newPlaylist = [];
            snapshot.forEach(doc => {
                const data = doc.data();
                newPlaylist.push({
                    id: doc.id,
                    url: data.url,
                    tipo: data.tipo, // 'imagen' o 'video'
                    duracion: data.duracion || 10 // segundos (por defecto 10 para imágenes)
                });
            });

            // Si hay diferencias, actualizamos
            if (JSON.stringify(playlist) !== JSON.stringify(newPlaylist)) {
                playlist = newPlaylist;
                console.log("Playlist actualizada desde la nube:", playlist);
                
                // Precargar elementos en el DOM
                rebuildDOM();

                if (!isPlaying) {
                    currentIndex = -1;
                    playNext();
                }
            }
        }, (error) => {
            console.error("Error al escuchar cartelera:", error);
            idleText.innerText = "Error de conexión con la base de datos.";
            mainLoader.style.display = 'none';
        });

        function rebuildDOM() {
            // Eliminar elementos antiguos
            container.innerHTML = '';

            playlist.forEach((item, index) => {
                let el;
                if (item.tipo === 'video') {
                    el = document.createElement('video');
                    el.src = item.url;
                    el.preload = 'auto'; // Obliga al navegador a descargar el video en segundo plano
                    el.muted = document.getElementById('bloque-navidad-tv') ? true : !audioEnabled;
                    if (document.getElementById('bloque-navidad-tv')) { el.defaultMuted = true; el.volume = 0; }
                    el.playsInline = true;
                    el.loop = false; // Queremos que termine para pasar al siguiente
                    
                    // Evento para avanzar cuando el video termina
                    el.addEventListener('ended', () => {
                        if (currentIndex === index) {
                            playNext();
                        }
                    });
                    
                    // Manejar errores de carga
                    el.addEventListener('error', () => {
                        console.error("Error cargando video:", item.url);
                        if (currentIndex === index) playNext();
                    });
                } else {
                    el = document.createElement('img');
                    el.src = item.url;
                    
                    el.addEventListener('error', () => {
                        console.error("Error cargando imagen:", item.url);
                        if (currentIndex === index) playNext();
                    });
                }

                el.className = 'media-item';
                el.id = 'media-' + index;
                // Configurar alta calidad de renderizado de imagen para pantallas grandes
                if(item.tipo !== 'video') {
                    el.style.imageRendering = 'high-quality';
                }
                container.appendChild(el);
            });
        }

        function playNext() {
            if (playlist.length === 0) {
                stopPlayback();
                return;
            }

            isPlaying = true;
            idleScreen.style.zIndex = -1; // Ocultar pantalla de idle
            
            // Ocultar actual
            const prevEl = document.getElementById('media-' + currentIndex);
            if (prevEl) {
                prevEl.classList.remove('active');
                prevEl.classList.add('previous');
                if (prevEl.tagName === 'VIDEO') {
                    prevEl.pause();
                    prevEl.currentTime = 0;
                }
                
                // Limpiar la clase previous después de que termine la transición
                setTimeout(() => {
                    prevEl.classList.remove('previous');
                }, 1200); // 1.2s es la duración de la transición en CSS
            }

            // Calcular siguiente
            currentIndex = (currentIndex + 1) % playlist.length;
            const currentItem = playlist[currentIndex];
            const currentEl = document.getElementById('media-' + currentIndex);

            if (!currentEl) {
                setTimeout(playNext, 1000);
                return;
            }

            // Mostrar actual
            currentEl.classList.add('active');
            
            clearTimeout(playTimeout);
            progressBar.style.transition = 'none';
            progressBar.style.width = '0%';

            if (currentItem.tipo === 'video') {
                const _navidadBgm = !!document.getElementById('bloque-navidad-tv');
                if (_navidadBgm) { unmuteBtn.style.display = 'none'; currentEl.muted = true; currentEl.volume = 0; } else { const _navidadBgm = !!document.getElementById('bloque-navidad-tv');
                if (_navidadBgm) { unmuteBtn.style.display = 'none'; currentEl.muted = true; currentEl.volume = 0; } else { const _navidadBgm = !!document.getElementById('bloque-navidad-tv');
                if (_navidadBgm) { unmuteBtn.style.display = 'none'; currentEl.muted = true; currentEl.volume = 0; } else { const _navidadBgm = !!document.getElementById('bloque-navidad-tv');
                if (_navidadBgm) { unmuteBtn.style.display = 'none'; currentEl.muted = true; currentEl.volume = 0; } else { if(!audioEnabled) unmuteBtn.style.display = 'block'; currentEl.muted = !audioEnabled; } } } }
                
                let playPromise = currentEl.play();
                if (playPromise !== undefined) {
                    playPromise.catch(error => {
                        console.warn("Autoplay prevenido. Silenciando y forzando play.", error);
                        currentEl.muted = true;
                        currentEl.play().catch(e => {
                            console.error("No se pudo reproducir el video:", e);
                            playNext();
                        });
                    });
                }
                
                currentEl.ontimeupdate = () => {
                    if(currentEl.duration) {
                        const percentage = (currentEl.currentTime / currentEl.duration) * 100;
                        progressBar.style.width = percentage + '%';
                    }
                };
            } else {
                // Es imagen
                setTimeout(() => {
                    progressBar.style.transition = `width ${currentItem.duracion}s linear`;
                    progressBar.style.width = '100%';
                }, 50);

                playTimeout = setTimeout(() => {
                    playNext();
                }, currentItem.duracion * 1000);
            }
        }

        function stopPlayback() {
            isPlaying = false;
            clearTimeout(playTimeout);
            idleScreen.style.zIndex = 10;
            container.innerHTML = '';
            progressBar.style.width = '0%';
        }
        // --- SISTEMA DE PARTÍCULAS 3D ---
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let w, h;

        function initParticles() {
            w = canvas.width = 2160;
            h = canvas.height = 4096;
            particles = [];
            for(let i = 0; i < 150; i++) {
                particles.push({
                    x: Math.random() * w - w/2,
                    y: Math.random() * h - h/2,
                    z: Math.random() * 1000,
                    size: Math.random() * 3.0 + 1.5,
                    color: Math.random() > 0.5 ? '#FF007F' : '#00F0FF'
                });
            }
        }

        function drawParticles() {
            requestAnimationFrame(drawParticles);
            
            if(idleScreen.style.zIndex === "-1") return; // No animar si hay video

            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)'; // Estela suave
            ctx.fillRect(0, 0, w, h);
            
            const cx = w/2;
            const cy = h/2;

            for(let i = 0; i < particles.length; i++) {
                let p = particles[i];
                p.z -= 5; // Velocidad de acercamiento un poco más rápida para el efecto hiperespacio
                
                // Si la partícula pasa por detrás de la cámara, la reiniciamos lejos
                if (p.z <= -200) {
                    p.z = 1000;
                    p.x = Math.random() * w - cx;
                    p.y = Math.random() * h - cy;
                }

                let fov = 400;
                let scale = fov / (fov + p.z);
                let x2d = p.x * scale + cx;
                let y2d = p.y * scale + cy;
                
                // Aparecen suavemente desde el fondo
                let alpha = (1 - p.z / 1000); 
                if (alpha < 0) alpha = 0;
                if (alpha > 1) alpha = 1;

                ctx.beginPath();
                ctx.arc(x2d, y2d, p.size * scale * 5, 0, Math.PI*2);
                ctx.fillStyle = p.color;
                ctx.globalAlpha = alpha;
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }

        window.addEventListener('resize', () => {
            if(canvas) initParticles();
            scaleViewport();
        });

        if(canvas) {
            initParticles();
            drawParticles();
        }

        function scaleViewport() {
            const vp = document.getElementById('tv-viewport');
            const urlParams = new URLSearchParams(window.location.search);
            const rot = urlParams.get('rotar'); // '90' o '-90'
            
            let w = window.innerWidth;
            let h = window.innerHeight;
            
            // Si el TV está horizontal (ej. 1920x1080) pero montado verticalmente
            if (rot === '90' || rot === '-90') {
                let temp = w;
                w = h;
                h = temp;
            }
            
            const scaleX = w / 2160;
            const scaleY = h / 4096;
            
            if (rot === '90' || rot === '-90') {
                // Primero escalamos y luego rotamos el resultado
                vp.style.transform = `rotate(${rot}deg) scale(${scaleX}, ${scaleY})`;
            } else {
                vp.style.transform = `scale(${scaleX}, ${scaleY})`;
            }
        }
        scaleViewport();
    </script>

        <script id="script-navidad-tv">
            (function() {
                // --- 0. Blindaje extra: asegurar que todos los videos estén en silencio ---
                function forceMuteAllVideos() {
                    document.querySelectorAll('video').forEach(v => {
                        if (!v.muted) v.muted = true;
                        if (v.volume > 0) v.volume = 0;
                    });
                }
                const mediaContainer = document.getElementById('media-container');
                if (mediaContainer) {
                    const muteObserver = new MutationObserver(forceMuteAllVideos);
                    muteObserver.observe(mediaContainer, { childList: true, subtree: true });
                }
                forceMuteAllVideos();

                // --- 1. Luces Navideñas entretejidas en la guirnalda de pino ---
                const lightsBar = document.getElementById('tv-christmas-lights-bar');
                if (lightsBar && lightsBar.children.length === 0) {
                    const colors = ['tv-bulb-warm', 'tv-bulb-gold', 'tv-bulb-red', 'tv-bulb-warm', 'tv-bulb-green', 'tv-bulb-blue'];
                    const count = 28;
                    for (let i = 0; i < count; i++) {
                        const bulb = document.createElement('div');
                        bulb.className = 'tv-light-bulb ' + colors[i % colors.length];
                        const pct = ((i + 0.5) / count) * 100;
                        const yWave = Math.sin(i * 1.15) * 32;
                        bulb.style.left = pct.toFixed(2) + '%';
                        bulb.style.top = (62 + yWave).toFixed(1) + 'px';
                        bulb.style.animationDelay = ((i % 6) * 0.28 + Math.random() * 0.5).toFixed(2) + 's';
                        lightsBar.appendChild(bulb);
                    }
                }

                // --- 2. Gorrito Navideño en el Logo de Espera (#idle-screen) ---
                const idleLogo = document.querySelector('#idle-screen .idle-logo');
                if (idleLogo && !document.getElementById('tv-idle-santa-hat')) {
                    const wrapper = document.createElement('div');
                    wrapper.style.cssText = 'position: relative; width: 60%; max-width: 1400px; display: inline-block;';
                    idleLogo.parentNode.insertBefore(wrapper, idleLogo);
                    idleLogo.style.width = '100%';
                    idleLogo.style.maxWidth = '100%';
                    wrapper.appendChild(idleLogo);

                    const hat = document.createElement('span');
                    hat.id = 'tv-idle-santa-hat';
                    hat.className = 'tv-santa-hat';
                    hat.innerHTML = `
                        <svg viewBox="0 0 100 85" width="100%" height="100%" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <linearGradient id="tvHatRed" x1="0" y1="0" x2="1" y2="1">
                                    <stop offset="0%" stop-color="#ff3b4e"/>
                                    <stop offset="55%" stop-color="#d90429"/>
                                    <stop offset="100%" stop-color="#7a0010"/>
                                </linearGradient>
                            </defs>
                            <path d="M 20 60 C 20 38 42 16 66 12 C 78 10 90 20 92 34 C 94 44 88 54 84 60 Z" fill="url(#tvHatRed)"/>
                            <path d="M 52 32 C 68 36 82 44 86 58 C 76 52 64 46 44 38 Z" fill="rgba(0,0,0,0.2)"/>
                            <circle cx="94" cy="34" r="9" fill="#ffffff"/>
                            <rect x="12" y="56" width="76" height="18" rx="9" fill="#ffffff"/>
                            <ellipse cx="22" cy="65" rx="8" ry="7" fill="#f8f9fa"/>
                            <ellipse cx="40" cy="65" rx="9" ry="8" fill="#ffffff"/>
                            <ellipse cx="60" cy="65" rx="9" ry="8" fill="#ffffff"/>
                            <ellipse cx="78" cy="65" rx="8" ry="7" fill="#f8f9fa"/>
                        </svg>
                    `;
                    wrapper.appendChild(hat);
                }

                // --- 3. Fondo Musical Navideño Moderno e Instrumental (10 Temas Rotando) ---
                const christmasPlaylist = [
                    { title: "Nouvelle Noel (Lounge)", artist: "Kevin MacLeod", url: "https://incompetech.com/music/royalty-free/mp3-royaltyfree/Nouvelle%20Noel.mp3" },
                    { title: "Tinsel & Mistletoe", artist: "Ahjay Stelino", url: "https://assets.mixkit.co/music/93/93.mp3" },
                    { title: "Our Journey (Acoustic Piano)", artist: "Michael Ramir C.", url: "https://assets.mixkit.co/music/1073/1073.mp3" },
                    { title: "Christmas Jazz", artist: "Diego Nava", url: "https://assets.mixkit.co/music/503/503.mp3" },
                    { title: "Winter Chimes", artist: "Kevin MacLeod", url: "https://incompetech.com/music/royalty-free/mp3-royaltyfree/Winter%20Chimes.mp3" },
                    { title: "Holidays Melodic", artist: "Grigoriy Nuzhny", url: "https://assets.mixkit.co/music/691/691.mp3" },
                    { title: "Forest Mist Whispers", artist: "Eugenio Mininni", url: "https://assets.mixkit.co/music/148/148.mp3" },
                    { title: "Deck the Halls (Smooth Piano)", artist: "Kevin MacLeod", url: "https://incompetech.com/music/royalty-free/mp3-royaltyfree/Deck%20the%20Halls%20A.mp3" },
                    { title: "My Christmas Prayer", artist: "Michael Ramir C.", url: "https://assets.mixkit.co/music/912/912.mp3" },
                    { title: "Winter Reflections", artist: "Kevin MacLeod", url: "https://incompetech.com/music/royalty-free/mp3-royaltyfree/Winter%20Reflections.mp3" }
                ];

                // Mezclar orden inicial (Fisher-Yates) para que no siempre arranque igual
                function shuffleTracks(arr) {
                    for (let i = arr.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [arr[i], arr[j]] = [arr[j], arr[i]];
                    }
                    return arr;
                }

                let shuffledTracks = shuffleTracks([...christmasPlaylist]);
                let trackIdx = 0;
                const TARGET_VOLUME = 0.42; // Volumen ambiental agradable que no cansa
                let isMusicMuted = false;
                let musicStarted = false;
                let fadeTimer = null;
                let consecutiveErrors = 0;

                const bgAudio = new Audio();
                bgAudio.preload = 'auto';
                bgAudio.volume = 0;

                const trackLabel = document.getElementById('tv-track-label');
                const promptBtn = document.getElementById('tv-bgm-prompt');
                const toggleBtn = document.getElementById('tv-bgm-toggle');
                const toggleIcon = document.getElementById('tv-bgm-icon');
                const nextBtn = document.getElementById('tv-bgm-next');

                function fadeInAudio() {
                    clearInterval(fadeTimer);
                    if (isMusicMuted) {
                        bgAudio.volume = 0;
                        return;
                    }
                    bgAudio.volume = 0;
                    fadeTimer = setInterval(() => {
                        if (isMusicMuted) {
                            bgAudio.volume = 0;
                            clearInterval(fadeTimer);
                            return;
                        }
                        if (bgAudio.volume < TARGET_VOLUME - 0.03) {
                            bgAudio.volume = Math.min(TARGET_VOLUME, bgAudio.volume + 0.03);
                        } else {
                            bgAudio.volume = TARGET_VOLUME;
                            clearInterval(fadeTimer);
                        }
                    }, 90);
                }

                function updateTrackUI(track) {
                    if (trackLabel && track) {
                        trackLabel.textContent = `${track.title} — ${track.artist} (${trackIdx + 1}/${shuffledTracks.length})`;
                    }
                }

                function playCurrentTrack() {
                    const track = shuffledTracks[trackIdx];
                    if (!track) return;
                    updateTrackUI(track);
                    bgAudio.src = track.url;
                    bgAudio.muted = isMusicMuted;

                    const playPromise = bgAudio.play();
                    if (playPromise !== undefined) {
                        playPromise.then(() => {
                            musicStarted = true;
                            consecutiveErrors = 0;
                            if (promptBtn) promptBtn.style.display = 'none';
                            fadeInAudio();
                        }).catch(err => {
                            if (err && err.name === 'NotAllowedError') {
                                // El navegador bloqueó reproducción automática con sonido hasta el primer clic/toque
                                if (promptBtn) promptBtn.style.display = 'flex';
                                if (trackLabel) trackLabel.textContent = 'Listo para sonar — Toca la pantalla 🎵';
                            } else {
                                console.warn('Error cargando pista navideña, pasando a la siguiente:', track.title, err);
                                handleTrackError();
                            }
                        });
                    }
                }

                function nextTrack() {
                    trackIdx++;
                    if (trackIdx >= shuffledTracks.length) {
                        shuffledTracks = shuffleTracks([...christmasPlaylist]);
                        trackIdx = 0;
                    }
                    playCurrentTrack();
                }

                function handleTrackError() {
                    consecutiveErrors++;
                    const delay = consecutiveErrors >= shuffledTracks.length ? 15000 : 1000;
                    if (consecutiveErrors >= shuffledTracks.length) consecutiveErrors = 0;
                    setTimeout(nextTrack, delay);
                }

                bgAudio.addEventListener('ended', nextTrack);
                bgAudio.addEventListener('error', () => {
                    console.warn('No se pudo cargar el audio:', bgAudio.src);
                    handleTrackError();
                });

                // Desbloquear audio al primer toque o tecla (también funciona con control remoto de TV)
                function unlockBackgroundMusic() {
                    if (!isMusicMuted && (!musicStarted || bgAudio.paused)) {
                        playCurrentTrack();
                    }
                }
                document.addEventListener('click', unlockBackgroundMusic);
                document.addEventListener('keydown', unlockBackgroundMusic);

                if (toggleBtn) {
                    toggleBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        isMusicMuted = !isMusicMuted;
                        bgAudio.muted = isMusicMuted;
                        if (!isMusicMuted) {
                            if (bgAudio.paused) playCurrentTrack();
                            else fadeInAudio();
                            if (toggleIcon) toggleIcon.textContent = '🔊';
                        } else {
                            clearInterval(fadeTimer);
                            bgAudio.volume = 0;
                            if (toggleIcon) toggleIcon.textContent = '🔇';
                        }
                    });
                }

                if (nextBtn) {
                    nextBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        nextTrack();
                    });
                }

                if (promptBtn) {
                    promptBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        if (typeof enterFullScreen === 'function') enterFullScreen();
                        playCurrentTrack();
                    });
                }

                // Iniciar rotación musical
                playCurrentTrack();

                // --- 4. Sistema de Nieve Optimizado para TV 24/7 ---
                const canvas = document.getElementById('tv-snow-canvas');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const W = canvas.width;  // 720
                const H = canvas.height; // 1365

                const flakes = [];
                for (let i = 0; i < 55; i++) {
                    flakes.push({
                        x: Math.random() * W,
                        y: Math.random() * H,
                        r: Math.random() * 2.8 + 1.4,
                        d: Math.random() * 55,
                        a: Math.random() * 0.45 + 0.25,
                        vy: Math.random() * 1.1 + 0.55,
                        vx: Math.random() * 0.4 - 0.2
                    });
                }

                let angle = 0;
                let rafId = null;

                function drawSnow() {
                    ctx.clearRect(0, 0, W, H);
                    angle += 0.008;
                    for (let i = 0; i < flakes.length; i++) {
                        const f = flakes[i];
                        ctx.beginPath();
                        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2, false);
                        ctx.fillStyle = `rgba(255, 255, 255, ${f.a})`;
                        ctx.fill();

                        f.y += f.vy;
                        f.x += Math.sin(angle + f.d) * 0.55 + f.vx;

                        if (f.y > H + 10) {
                            f.y = -10;
                            f.x = Math.random() * W;
                        }
                        if (f.x > W + 10) f.x = -10;
                        else if (f.x < -10) f.x = W + 10;
                    }
                    rafId = requestAnimationFrame(drawSnow);
                }

                drawSnow();

                document.addEventListener('visibilitychange', () => {
                    if (document.hidden) {
                        if (rafId) {
                            cancelAnimationFrame(rafId);
                            rafId = null;
                        }
                    } else if (!rafId) {
                        drawSnow();
                    }
                });
            })();
        </script>
